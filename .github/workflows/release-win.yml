name: Release (Windows)

# 精简版 Windows 发布构建：手动触发或推送 v* tag 触发。
# 只构建 Windows x64，并生成由 fork 自有密钥签名的 Tauri Updater 制品。
# 推送 v* tag 时同时发布 latest.json，供应用内检查更新使用。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-win-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.3
          run_install: false

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Prepare Tauri updater signing key
        shell: bash
        env:
          RAW_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SIGNING_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$RAW_SIGNING_KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY Secret is required" >&2
            exit 1
          fi

          RAW="$RAW_SIGNING_KEY"
          KEY_PATH="$RUNNER_TEMP/tauri_signing.key"
          if echo "$RAW" | head -n1 | grep -q '^untrusted comment:'; then
            printf '%s\n' "$RAW" > "$KEY_PATH"
          elif DECODED=$(printf '%s' "$RAW" | base64 --decode 2>/dev/null) \
            && echo "$DECODED" | head -n1 | grep -q '^untrusted comment:'; then
            printf '%s\n' "$DECODED" > "$KEY_PATH"
          elif echo "$RAW" | grep -Eq '^[A-Za-z0-9+/=]+$'; then
            printf '%s\n%s\n' 'untrusted comment: tauri signing key' "$RAW" > "$KEY_PATH"
          else
            echo "TAURI_SIGNING_PRIVATE_KEY has an unsupported format" >&2
            exit 1
          fi

          KEY_B64=$(base64 < "$KEY_PATH" | tr -d '\r\n')
          echo "TAURI_SIGNING_PRIVATE_KEY=$KEY_B64" >> "$GITHUB_ENV"
          if [ -n "$SIGNING_KEY_PASSWORD" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"
          fi

      - name: Build Tauri App (Windows x64)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm tauri build

      - name: Prepare Windows Assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $VERSION = $env:GITHUB_REF_NAME
          if ([string]::IsNullOrEmpty($VERSION)) { $VERSION = 'dev' }
          $targetRoot = 'src-tauri/target/release'

          # MSI 安装器
          $msi = Get-ChildItem -Path (Join-Path $targetRoot 'bundle/msi') -Recurse -Include *.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -ne $msi) {
            $dest = "CC-Switch-$VERSION-Windows.msi"
            Copy-Item $msi.FullName (Join-Path release-assets $dest)
            Write-Host "MSI copied: $dest"
            $sigPath = "$($msi.FullName).sig"
            if (-not (Test-Path $sigPath)) {
              throw "Tauri updater signature not found for $($msi.Name)"
            }
            Copy-Item $sigPath (Join-Path release-assets "$dest.sig")
            Write-Host "Updater signature copied: $dest.sig"
          } else {
            throw 'No MSI installer found'
          }

          # NSIS 安装器
          $nsis = Get-ChildItem -Path (Join-Path $targetRoot 'bundle/nsis') -Recurse -Include *-setup.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -ne $nsis) {
            $dest = "CC-Switch-$VERSION-Windows-setup.exe"
            Copy-Item $nsis.FullName (Join-Path release-assets $dest)
            Write-Host "NSIS setup copied: $dest"
          } else {
            Write-Warning 'No NSIS installer found'
          }

          # 绿色版（portable）：仅可执行文件打 zip
          $exePath = 'src-tauri/target/release/cc-switch.exe'
          if (Test-Path $exePath) {
            $portableDir = 'release-assets/CC-Switch-Portable'
            New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
            Copy-Item $exePath $portableDir
            $portableIniPath = Join-Path $portableDir 'portable.ini'
            $portableContent = @('# CC Switch portable build marker', 'portable=true')
            $portableContent | Set-Content -Path $portableIniPath -Encoding UTF8
            $portableZip = "release-assets/CC-Switch-$VERSION-Windows-Portable.zip"
            Compress-Archive -Path "$portableDir/*" -DestinationPath $portableZip -Force
            Remove-Item -Recurse -Force $portableDir
            Write-Host "Portable zip created: CC-Switch-$VERSION-Windows-Portable.zip"

            # 替换版：保留原名的裸 exe，已装过 cc-switch 的用户直接覆盖同名文件即可升级
            Copy-Item $exePath 'release-assets/cc-switch.exe'
            Write-Host 'Replacement exe copied: cc-switch.exe'
          } else {
            Write-Warning "Portable exe not found at $exePath"
          }

      - name: List prepared assets
        shell: pwsh
        run: Get-ChildItem -Recurse release-assets | Format-Table -AutoSize

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-windows-x86_64
          path: release-assets/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-22.04
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-assets-windows-*
          path: release-assets
          merge-multiple: true

      - name: List downloaded artifacts
        shell: bash
        run: ls -la release-assets

      - name: Generate latest.json
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ github.ref_name }}'
          $version = $tag -replace '^v', ''
          $signatureFile = Get-ChildItem -LiteralPath release-assets -Filter '*-Windows.msi.sig' | Select-Object -First 1
          if ($null -eq $signatureFile) {
            throw 'No signed Windows MSI updater artifact found'
          }

          $installerName = $signatureFile.Name -replace '\.sig$', ''
          $signature = (Get-Content -LiteralPath $signatureFile.FullName -Raw -Encoding UTF8).Trim()
          $url = "https://github.com/${{ github.repository }}/releases/download/$tag/$installerName"
          $manifest = [ordered]@{
            version = $version
            notes = "Release $tag"
            pub_date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = [ordered]@{
              'windows-x86_64' = [ordered]@{
                signature = $signature
                url = $url
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath 'release-assets/latest.json' -Encoding UTF8
          Get-Content -LiteralPath 'release-assets/latest.json' -Encoding UTF8

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: CC Switch ${{ github.ref_name }}
          prerelease: false
          body: |
            ## CC Switch ${{ github.ref_name }}

            连通性检测回退版：恢复真实 LLM 流式探测（修复 #4347 — HTTP 可达性探测会把 503 等错误误判为"通"）。

            ### 下载（Windows）

            - **x86_64**: `CC-Switch-${{ github.ref_name }}-Windows-setup.exe`（NSIS 安装版）/ `.msi`（MSI 安装版）/ `-Portable.zip`（绿色版，解压即用）
            - **替换版**: `cc-switch.exe` — 已在用 cc-switch（官方版或绿色版）的用户，下载后直接覆盖原目录下的同名 `cc-switch.exe` 即可切换到本版本，配置不受影响，无需重新解压安装

            > 本版本未做代码签名，Windows SmartScreen 可能提示"未知发布者"，选择"仍要运行"即可。
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
